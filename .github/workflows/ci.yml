name: Pipeline Pizzaria

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rodar testes
        run: mvn -B test

      - name: Criar JAR
        run: mvn -B package -DskipTests

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Pizzaria-jar
          path: target/*.jar